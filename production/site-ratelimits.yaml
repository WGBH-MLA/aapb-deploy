apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: private-ratelimit
spec:
  rateLimit:
    average: 50
    burst: 100
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: public-ratelimit
spec:
  rateLimit:
    average: 10
    burst: 20
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: global-ratelimit-1s
spec:
  rateLimit:
    average: 4
    burst: 16
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 1
---
