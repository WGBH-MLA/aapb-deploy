apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    argocd.argoproj.io/instance: aapb
  name: aapb-ingress
  namespace: aapb
spec:
  routes:
  - kind: Rule
    match: Host(`americanarchive.org`) && ClientIP(`198.147.175.0/24`, `204.152.12.0/23`, `74.104.110.159`)
    priority: 100
    middlewares:
    - name: aapb-cache
    - name: private-ratelimit
    services:
    - kind: Service
      name: aapb
      port: 443

  # Exempt from human-id so the challenge can be solved without a redirect loop
  - kind: Rule
    match: Host(`americanarchive.org`) && (Path(`/turnstile_challenge`) || Path(`/turnstile_verify`) || PathPrefix(`/assets`))
    priority: 20
    middlewares:
    - name: aapb-cache
    - name: public-ratelimit
    services:
    - kind: Service
      name: aapb
      port: 443

  - kind: Rule
    match: Host(`americanarchive.org`) && PathPrefix(`/catalog`)
    priority: 10
    middlewares:
    # human-id must precede aapb-cache so the challenge redirect is never cached
    - name: human-id
    - name: human-id-ratelimit
    - name: aapb-cache
    - name: instant-ratelimit
    - name: short-ratelimit
    - name: medium-ratelimit
    - name: long-ratelimit
    - name: high-volume-ratelimit
    - name: very-high-volume-ratelimit
    services:
    - kind: Service
      name: aapb
      port: 443

  - kind: Rule
    match: Host(`americanarchive.org`)
    priority: 1
    middlewares:
    - name: aapb-cache
    - name: public-ratelimit
    services:
    - kind: Service
      name: aapb
      port: 443
  tls:
    secretName: aapb-tls
