apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: human-id
spec:
  forwardAuth:
    # Same host the aapb Service resolves to; the check must stay cheap, it runs on every request
    address: https://aapb-prod.wgbh-mla.org/turnstile_check
    authRequestHeaders:
    - Cookie
    authResponseHeaders:
    - X-Aapb-Human-Id
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: human-id-ratelimit
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 20
    sourceCriterion:
      requestHeaderName: X-Aapb-Human-Id
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: private-ratelimit
spec:
  rateLimit:
    average: 50
    burst: 100
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: public-ratelimit
spec:
  rateLimit:
    average: 20
    burst: 50
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: instant-ratelimit
spec:
  rateLimit:
    average: 4
    burst: 16
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: short-ratelimit
spec:
  rateLimit:
    average: 8
    burst: 32
    period: 3s
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: medium-ratelimit
spec:
  rateLimit:
    average: 16
    burst: 48
    period: 10s
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: long-ratelimit
spec:
  rateLimit:
    average: 30
    burst: 120
    period: 30s
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: high-volume-ratelimit
spec:
  rateLimit:
    average: 100
    period: 2m
    burst: 300
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: very-high-volume-ratelimit
spec:
  rateLimit:
    average: 150
    burst: 400
    period: 5m
    sourceCriterion:
      ipStrategy:
        depth: 1
