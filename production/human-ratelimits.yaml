apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: rate-limited-page }
spec:
  errors:
    status: [ "429" ]
    query: /{status}
    service: { name: aapb, port: 443 }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id }
spec:
  forwardAuth:
    address: https://aapb-prod.wgbh-mla.org/turnstile_check
    authRequestHeaders: [ Cookie ]
    authResponseHeaders: [ X-Aapb-Human-Id ]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-5s }
spec:
  rateLimit:
    average: 3
    period: 5s
    burst: 5
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-1m }
spec:
  rateLimit:
    average: 8
    period: 1m
    burst: 16
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-5m }
spec:
  rateLimit:
    average: 15
    period: 5m
    burst: 20
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-1h }
spec:
  rateLimit:
    average: 40
    period: 1h
    burst: 60
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-24h }
spec:
  rateLimit:
    average: 90
    period: 24h
    burst: 80
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
