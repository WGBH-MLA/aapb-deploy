apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: rate-limited-page }
spec:
  errors:
    status: [ "429" ]
    query: /{status}
    service: { name: aapb, port: 443 }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id }
spec:
  forwardAuth:
    address: https://aapb-prod.wgbh-mla.org/turnstile_check
    authRequestHeaders: [ Cookie ]
    authResponseHeaders: [ X-Aapb-Human-Id ]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-3s }
spec:
  rateLimit:
    average: 3
    period: 3s
    burst: 5
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-1m }
spec:
  rateLimit:
    average: 10
    period: 1m
    burst: 15
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-5m }
spec:
  rateLimit:
    average: 20
    period: 5m
    burst: 30
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-1h }
spec:
  rateLimit:
    average: 60
    period: 1h
    burst: 80
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-24h }
spec:
  rateLimit:
    average: 180
    period: 24h
    burst: 120
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
