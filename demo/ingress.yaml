apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aapb-ingress
  namespace: aapb-demo
spec:
  parentRefs:
  - name: turnstile
  routes:
  - kind: Rule
    match: Host(`demo.aapb.wgbh-mla.org`)
    middlewares:
    - name: aapb-cache
    services:
    - name: aapb
      port: 443
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aapb-ingress-catalog
  namespace: aapb-demo
spec:
  parentRefs:
  - name: turnstile
  routes:
  - kind: Rule
    match: Host(`demo.aapb.wgbh-mla.org`) && PathPrefix(`/catalog`)
    middlewares:
    - name: rate-limited-page
    - name: ip-ratelimit-5s
    - name: ip-ratelimit-1m
    - name: ip-ratelimit-5m
    - name: ip-ratelimit-1h
    - name: ip-ratelimit-24h
    services:
    - name: aapb
      port: 443
---
# Child IngressRoutes attach with parentRefs, so the plugin runs once and its verified-IP cache is shared.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: turnstile
  namespace: aapb-demo
spec:
  tls:
    secretName: aapb-demo-tls-production
  routes:
  - kind: Rule
    match: Host(`demo.aapb.wgbh-mla.org`)
    middlewares:
    - name: turnstile-protect
