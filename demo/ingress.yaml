apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: turnstile
  namespace: aapb-demo
spec:
  tls:
    secretName: aapb-demo-tls-production
  routes:
  - kind: Rule
    match: Host(`demo.aapb.wgbh-mla.org`)
    middlewares:
    - name: turnstile-protect
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aapb-ingress
  namespace: aapb-demo
spec:
  parentRefs:
  - name: turnstile
  routes:
  - kind: Rule
    match: Host(`demo.aapb.wgbh-mla.org`) && PathPrefix(`/catalog`)
    priority: 10
    middlewares:
    - name: rate-limited-page
    - name: human-id
    - name: human-id-ratelimit-5s
    - name: human-id-ratelimit-1m
    - name: human-id-ratelimit-5m
    - name: human-id-ratelimit-1h
    - name: human-id-ratelimit-24h
    services:
    - name: aapb
      port: 443

  - kind: Rule
    match: Host(`demo.aapb.wgbh-mla.org`) && (Path(`/turnstile_challenge`) || Path(`/turnstile_verify`))
    priority: 5
    middlewares:
    - name: public-ratelimit
    services:
    - kind: Service
      name: aapb
      port: 443

  - kind: Rule
    match: Host(`demo.aapb.wgbh-mla.org`)
    priority: 1
    middlewares:
    - name: aapb-cache
    - name: public-ratelimit
    services:
    - name: aapb
      port: 443
  tls:
    secretName: aapb-demo-tls-production
