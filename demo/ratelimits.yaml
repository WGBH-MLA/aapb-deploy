apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: rate-limited-page, namespace: aapb-demo }
spec:
  errors:
    status: [ "429" ]
    query: /{status}
    service: { name: aapb, port: 443 }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id, namespace: aapb-demo }
spec:
  forwardAuth:
    address: https://aapb-demo.wgbh-mla.org/turnstile_check
    authRequestHeaders: [ Cookie ]
    authResponseHeaders: [ X-Aapb-Human-Id ]
    # false makes Traefik rebuild X-Forwarded-Proto/Host/Uri itself, which turnstile#check uses for the redirect.
    trustForwardHeader: false
    # Only a short redirect body is expected from turnstile#check.
    maxResponseBodySize: 16384
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-5s, namespace: aapb-demo }
spec:
  rateLimit:
    average: 3
    period: 5s
    burst: 4
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-1m, namespace: aapb-demo }
spec:
  rateLimit:
    average: 8
    period: 1m
    burst: 16
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-5m, namespace: aapb-demo }
spec:
  rateLimit:
    average: 15
    period: 5m
    burst: 20
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-1h, namespace: aapb-demo }
spec:
  rateLimit:
    average: 40
    period: 1h
    burst: 60
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-24h, namespace: aapb-demo }
spec:
  rateLimit:
    average: 90
    period: 24h
    burst: 80
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
