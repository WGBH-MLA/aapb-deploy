apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: rate-limited-page, namespace: aapb-demo }
spec:
  errors:
    status: [ "429" ]
    query: /{status}
    service: { name: aapb, port: 443 }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id, namespace: aapb-demo }
spec:
  forwardAuth:
    address: https://aapb-demo.wgbh-mla.org/turnstile_check
    authRequestHeaders: [ Cookie ]
    authResponseHeaders: [ X-Aapb-Human-Id ]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-3s, namespace: aapb-demo }
spec:
  rateLimit:
    average: 3
    period: 3s
    burst: 4
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-1m, namespace: aapb-demo }
spec:
  rateLimit:
    average: 10
    period: 1m
    burst: 15
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-5m, namespace: aapb-demo }
spec:
  rateLimit:
    average: 20
    period: 5m
    burst: 30
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-1h, namespace: aapb-demo }
spec:
  rateLimit:
    average: 60
    period: 1h
    burst: 40
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: human-id-ratelimit-24h, namespace: aapb-demo }
spec:
  rateLimit:
    average: 90
    period: 24h
    burst: 80
    sourceCriterion: { requestHeaderName: X-Aapb-Human-Id }
