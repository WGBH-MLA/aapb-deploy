apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: rate-limited-page }
spec:
  errors:
    status: [ "429" ]
    query: /{status}
    service: { name: aapb, port: 443 }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: ip-ratelimit-5s }
spec:
  rateLimit:
    average: 3
    period: 5s
    burst: 5
    sourceCriterion: { ipStrategy: { depth: 1 } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: ip-ratelimit-1m }
spec:
  rateLimit:
    average: 10
    period: 1m
    burst: 15
    sourceCriterion: { ipStrategy: { depth: 1 } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: ip-ratelimit-5m }
spec:
  rateLimit:
    average: 20
    period: 5m
    burst: 30
    sourceCriterion: { ipStrategy: { depth: 1 } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: ip-ratelimit-1h }
spec:
  rateLimit:
    average: 60
    period: 1h
    burst: 80
    sourceCriterion: { ipStrategy: { depth: 1 } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: ip-ratelimit-24h }
spec:
  rateLimit:
    average: 180
    period: 24h
    burst: 120
    sourceCriterion: { ipStrategy: { depth: 1 } }
